name: Bug report
description: Help us reproduce something that went wrong.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS, Xcode/SDK, simulator/device, Node version, browser"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant logs
      description: Remove API keys, private photos and session tokens before posting.
